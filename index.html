<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main>
        <div class="main-container">
            <aside class="side-panel">
                <img class="hero-img" src="./assets/deepak-rastogi-dpnQQ4rlDj8-unsplash.jpg" alt="" class="hero-img" />
                <div class="logo-container">
                    <img src="./assets/odin-lined.png" alt="logo-image" class="logo" />
                    <p class="odin">ODIN</p>
                </div>
                <div class="credit">
                    Photo by Deepak Rastogi on
                    <a href="https://unsplash.com/photos/a-metal-hook-with-a-sign-on-it-dpnQQ4rlDj8">Unsplash</a>
                </div>
            </aside>

            <section class="main-content">
                <h2 class="maincaption">Behold! ODIN has spoken</h2>
                <p class="call-to-action">
                    Swear the oath (it’s just your email, no blood required) and receive
                    updates, tips, resources and developer wisdom straight from the
                    All-Father himself.
                </p>
                <div class="sign-up-container">
                    <form action="#" method="post">
                        <fieldset>
                            <h2>Join the ODIN Newsletter <em>now!</em></h2>
                            <div class="form-wrapper">
                                <div class="form-group first-name">
                                    <label for="first-name">* FIRST NAME</label>
                                    <input type="text" id="first-name" placeholder="Thor *" name="first-name" value=""
                                        pattern="^[^0-9]+$" maxlength="200" required />
                                </div>
                                <div class="form-group last-name">
                                    <label for="last-name">* LAST NAME</label>
                                    <input type="text" id="last-name" placeholder="Odinson *" name="last-name" value=""
                                        pattern="^[^0-9]+$" maxlength="200" required />
                                </div>
                                <div class="form-group email-form">
                                    <label for="email">* EMAIL</label>
                                    <input type="email" id="email" placeholder="thor@example.com *" name="email"
                                        value="" maxlength="200" required />
                                </div>
                                <div class="form-group phone-form">
                                    <label for="phone">PHONE NUMBER</label>
                                    <input type="tel" id="phone" placeholder="+ 1 234 456 7891" name="phone" value=""
                                        pattern="^\+?[0-9 ()-]{7,20}$" maxlength="200" />
                                </div>
                                <div class="form-group password-form">
                                    <label for="password">* PASSWORD</label>
                                    <input type="password" id="password" placeholder="Enter strong password *"
                                        name="password" value=""
                                        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$"
                                        maxlength="200" required />
                                </div>
                                <div class="form-group confirm-password">
                                    <label for="password">* CONFIRM PASSWORD</label>
                                    <input type="password" id="confirm-password" placeholder="Confirm password *"
                                        name="confirm-password" value="" maxlength="200" required />
                                </div>
                            </div>
                        </fieldset>
                        <div class="create-btn">
                            <button type="button" class="button">Create Account</button>
                        </div>
                    </form>
                </div>

                <div class="login">
                    <p>
                        Already have an account? <a href="./" class="log-in">Log in</a>
                    </p>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
